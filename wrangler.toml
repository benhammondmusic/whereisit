name = "whereisit"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "whereisit"
# Replace with the id from `npx wrangler d1 create whereisit`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Photos. Create with `npx wrangler r2 bucket create whereisit-photos` before first deploy.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "whereisit-photos"

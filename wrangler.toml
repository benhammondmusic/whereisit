name = "whereisit"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "whereisit"
database_id = "05a32e6a-0e99-4d39-8d6e-d564d1d5c295"
migrations_dir = "migrations"

# Photos. Create with `npx wrangler r2 bucket create whereisit-photos` before first deploy.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "whereisit-photos"
